server:
  port: ${SERVER_PORT}

spring:
  datasource:
    url: ${IDENTITY_DB_URL}
    username: ${IDENTITY_DB_USER}
    password: ${IDENTITY_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
  flyway:
    enabled: ${FLYWAY_ENABLED}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE}
    baseline-version: ${FLYWAY_BASELINE_VERSION}

banquito:
  security:
    jwt:
      issuer: ${JWT_ISSUER}
      secret: ${JWT_SECRET}
      access-token-minutes: ${ACCESS_TOKEN_MINUTES}
      refresh-token-days: ${REFRESH_TOKEN_DAYS}
  demo:
    enabled: ${DEMO_DATA_ENABLED}
    password: ${DEMO_PASSWORD}
  onboarding:
    customer-activation-base-url: ${BANQUITO_CUSTOMER_ACTIVATION_BASE_URL}
  integrations:
    admin:
      base-url: ${ADMIN_SERVICE_BASE_URL}
    notification:
      base-url: ${NOTIFICATION_SERVICE_BASE_URL}
  internal:
    service-key: ${INTERNAL_SERVICE_KEY}
  integration:
    outbox:
      enabled: ${IDENTITY_OUTBOX_ENABLED}
      batch-size: ${IDENTITY_OUTBOX_BATCH_SIZE}
      max-attempts: ${IDENTITY_OUTBOX_MAX_ATTEMPTS}
      fixed-delay-ms: ${IDENTITY_OUTBOX_FIXED_DELAY_MS}
