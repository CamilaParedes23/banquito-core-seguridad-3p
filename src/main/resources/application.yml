server:
  port: ${SERVER_PORT}
  forward-headers-strategy: framework

spring:
  application:
    name: ${SPRING_APPLICATION_NAME}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  datasource:
    url: ${IDENTITY_DB_URL}
    username: ${IDENTITY_DB_USER}
    password: ${IDENTITY_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE}
      minimum-idle: ${DB_MIN_IDLE}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL}
        jdbc:
          time_zone: ${APP_TIMEZONE}
  flyway:
    enabled: ${FLYWAY_ENABLED}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE}
    baseline-version: ${FLYWAY_BASELINE_VERSION}
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_ENDPOINTS}
  endpoint:
    health:
      show-details: ${ACTUATOR_HEALTH_DETAILS}
  health:
    db:
      enabled: true

springdoc:
  api-docs:
    path: ${OPENAPI_DOCS_PATH}
  swagger-ui:
    path: ${SWAGGER_UI_PATH}

banquito:
  security:
    jwt:
      issuer: ${JWT_ISSUER}
      secret: ${JWT_SECRET}
      access-token-minutes: ${ACCESS_TOKEN_MINUTES}
      refresh-token-days: ${REFRESH_TOKEN_DAYS}
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID}
      issuer: ${GOOGLE_OAUTH_ISSUER}
      jwk-set-uri: ${GOOGLE_OAUTH_JWK_SET_URI}
  demo:
    enabled: ${DEMO_DATA_ENABLED}
    password: ${DEMO_PASSWORD}
  onboarding:
    customer-activation-base-url: ${BANQUITO_CUSTOMER_ACTIVATION_BASE_URL}
  integrations:
    admin:
      base-url: ${ADMIN_SERVICE_BASE_URL}
    notification:
      base-url: ${NOTIFICATION_SERVICE_BASE_URL}
  internal:
    service-key: ${INTERNAL_SERVICE_KEY}
  integration:
    outbox:
      enabled: ${IDENTITY_OUTBOX_ENABLED}
      batch-size: ${IDENTITY_OUTBOX_BATCH_SIZE}
      max-attempts: ${IDENTITY_OUTBOX_MAX_ATTEMPTS}
      fixed-delay-ms: ${IDENTITY_OUTBOX_FIXED_DELAY_MS}
